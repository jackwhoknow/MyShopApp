version: 2
updates:
  # 后端 Maven 依赖
  - package-ecosystem: maven
    directory: /MyShopApp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]

  # 前端 npm 依赖
  - package-ecosystem: npm
    directory: /shop-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
